<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ledo Kick</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 30px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #1a1a1a;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 {
            text-align: center;
            color: #53FC18;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #b3b3b3;
        }
        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            background-color: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            font-size: 16px;
        }
        input:focus {
            border-color: #53FC18;
            outline: none;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #53FC18;
            color: black;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #42cb12;
        }
        .status-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #222;
            border-left: 4px solid #53FC18;
            border-radius: 4px;
            text-align: center;
            font-size: 14px;
            color: #53FC18;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Ledo Kick</h1>
    
    <div class="form-group">
        <label>🔑 توكن الحساب (Token):</label>
        <input type="text" id="token" placeholder="أدخل الـ Token الخاص بالحساب هنا...">
    </div>

    <div class="form-group">
        <label>📺 اسم القناة المستهدفة (Channel Slug):</label>
        <input type="text" id="channel" placeholder="مثال: xqc">
    </div>

    <div class="form-group">
        <label>⏱️ وقت الإرسال للقناة (بالثواني):</label>
        <input type="number" id="delaySeconds" value="60" min="5">
    </div>

    <button onclick="addBot()">+ إضافة وتشغيل الحساب</button>

    <div class="status-box">
        الماكينة متصلة بالسيرفر وتعمل الآن بنشاط (24/7) 🟢
    </div>
</div>

<script>
    async function addBot() {
        const token = document.getElementById('token').value;
        const channel = document.getElementById('channel').value;
        const delaySeconds = document.getElementById('delaySeconds').value;

        if(!token || !channel) {
            alert('يا ليدو اكتب التوكن واسم القناة الأول!');
            return;
        }

        const response = await fetch('/api/add-bot', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, channel, delaySeconds: parseInt(delaySeconds) })
        });

        if(response.ok) {
            alert('🚀 تم إضافة الحساب وجاري تشغيل التايمر المخصص له في الخلفية!');
            document.getElementById('token').value = '';
            document.getElementById('channel').value = '';
        } else {
            alert('❌ حصل مشكلة أثناء الحفظ في السيرفر.');
        }
    }
</script>
</body>
</html>
